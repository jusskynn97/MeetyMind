spring:
  application:
    name: discovery_server
server:
  port: 8761
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
    registry-fetch-interval-seconds: 30
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    com:
      netflix:
        eureka: off
        discovery: off
